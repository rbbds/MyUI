name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Report mode: writes the job summary and an artifact, never fails. Becomes --strict after PR 6.
      - run: npm run lint:tokens
      # Fails when a control border or the active option is below 3:1 in any style or theme.
      - run: npm run check:contrast
      - uses: actions/upload-artifact@v4
        with:
          name: token-lint
          path: reports/
      - run: npm run build
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
