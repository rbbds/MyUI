name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Fails on any token-lint finding (keuze 18b). Writes the job summary and an artifact.
      - run: npm run lint:tokens -- --strict
      # Fails when a component token has no binding in Figma and is not pending (docs/reports/figma-bindings.json, keuze 18b).
      - run: npm run report:figma-bindings -- --strict
      # Fails when a control border or the active option is below 3:1 in any style or theme.
      - run: npm run check:contrast
      # Fails on fixed user-facing text in component JSX: every text must be a prop.
      - run: npm run check:strings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: token-lint
          path: reports/
      - run: npm run build
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
