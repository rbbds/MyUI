name: Publish package
# Publishes @rbbds/ui to npmjs.com when you publish a GitHub Release (tag vX.Y.Z).
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret. Set it up once on
# npmjs.com > @rbbds/ui > Settings > Trusted publisher: GitHub Actions,
# owner rbbds, repository MyUI, workflow publish.yml.
# The very first version (1.0.0) is published by hand, because a trusted
# publisher can only be added to a package that exists.
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # OIDC for trusted publishing and provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: npm 11.5.1 or newer (needed for trusted publishing)
        run: npm install -g npm@latest
      - run: npm ci
      - name: Check that the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then echo "Tag v$TAG does not match package.json $VERSION"; exit 1; fi
      - run: npm run build
      - run: npm publish --access public
